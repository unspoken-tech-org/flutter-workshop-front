name: Build and Release (Windows)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: "stable"

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      # A versão vem da tag (vX.Y.Z ou vX.Y.Z-rc.N -> X.Y.Z); o pubspec.yaml não é
      # atualizado. Execução manual fora de tag usa a versão do pubspec.yaml.
      - name: Resolve version
        id: get_version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-.+)?$ ]] || {
              echo "::error::tag $REF_NAME is not vX.Y.Z or vX.Y.Z-<suffix>"
              exit 1
            }
            version="${BASH_REMATCH[1]}"
          else
            version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          fi
          [[ -n "$version" ]] || { echo "::error::could not resolve the version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      # Os valores entram por --dart-define; nenhum .env vai para o bundle.
      # --build-name grava a versão no executável: o UpdateService compara
      # PackageInfo.version com a tag de /releases/latest.
      - name: Build Windows Release
        run: flutter build windows --release --dart-define-from-file=.env-prd --build-name=${{ steps.get_version.outputs.VERSION }}

      - name: Download and Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup-installer.exe"
          Start-Process -FilePath "innosetup-installer.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $setupScript = Get-Content installer\workshopApp.iss -Raw
          $setupScript = $setupScript -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"${{ steps.get_version.outputs.VERSION }}`""
          Set-Content -Path installer\workshopApp.iss -Value $setupScript
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\workshopApp.iss

      - name: Extract release notes from annotated tag
        id: get_release_notes
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $tagContentArray = git cat-file -p $tagName
          $tagContent = $tagContentArray -join "`n"
          $lines = $tagContent -split '\r?\n'
          $messageStartIndex = -1
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ([string]::IsNullOrWhiteSpace($lines[$i])) {
              $messageStartIndex = $i + 1
              break
            }
          }
          $notes = "Nenhuma nota de release fornecida."
          if ($messageStartIndex -gt 0 -and $messageStartIndex -lt $lines.Length) {
            $tagMessage = ($lines[$messageStartIndex..($lines.Length-1)] -join "`n").Trim()
            if ($tagMessage -match '###\s*Novidades\s*\r?\n\r?\n([\s\S]+)') {
              $notes = $matches[1].Trim()
            } elseif ($tagMessage -match 'Release\s+[\d\.]+\s*\r?\n\r?\n([\s\S]+)') {
              $notes = $matches[1].Trim()
            } else {
              $msgLines = $tagMessage -split '\r?\n'
              if ($msgLines.Length -gt 1) {
                $tmp = ($msgLines[1..($msgLines.Length-1)] -join "`n").Trim()
                if ($tmp) { $notes = $tmp }
              } else {
                $notes = $tagMessage
              }
            }
          }
          "NOTES<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Só tag estável (vX.Y.Z, sem sufixo) vira release "latest". Tag com sufixo
      # (vX.Y.Z-test, vX.Y.Z-rc.1) ou execução manual fora de tag vira pré-release,
      # que o UpdateService ignora (/releases/latest não retorna pré-releases).
      - name: Detect release type
        id: release_type
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "SUFFIX=" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == "tag" && "$REF_NAME" == *-* ]]; then
            suffix="${REF_NAME#*-}"
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "SUFFIX=-${suffix//[^A-Za-z0-9.]/-}" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "SUFFIX=-dev-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      # A release final mostra ao usuário a mensagem da tag em pt-BR: o
      # UpdateService exibe o body de /releases/latest no diálogo de atualização.
      # Pré-release de tag (vX.Y.Z-rc.N) não chega ao app; ela leva as notas
      # geradas pelo GitHub desde a última tag final.
      - name: Build release body
        id: body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release_type.outputs.PRERELEASE }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          NOTES: ${{ steps.get_release_notes.outputs.NOTES }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$PRERELEASE" == "true" ]]; then
            # Última vX.Y.Z abaixo de v$VERSION.
            prev="$( { git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION"; echo "v$VERSION"; } \
              | sort -V | grep -B1 -x "v$VERSION" | grep -vx "v$VERSION" || true)"
            args=(-f "tag_name=$REF_NAME" -f "target_commitish=$GITHUB_SHA")
            [[ -n "$prev" ]] && args+=(-f "previous_tag_name=$prev")
            body="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body)"
          else
            body="$(printf '## v%s\n\n### Novidades\n\n%s\n' "$VERSION" "$NOTES")"
          fi
          {
            echo "BODY<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # O instalador de pré-release não pode ter o mesmo nome do estável.
      - name: Rename pre-release installer
        if: steps.release_type.outputs.PRERELEASE == 'true'
        shell: bash
        env:
          SUFFIX: ${{ steps.release_type.outputs.SUFFIX }}
        run: |
          shopt -s nullglob
          for exe in output/*.exe; do
            mv "$exe" "${exe%.exe}${SUFFIX}.exe"
          done
          ls output

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}${{ steps.release_type.outputs.SUFFIX }}
          body: ${{ steps.body.outputs.BODY }}
          files: ./output/*.exe
          draft: false
          prerelease: ${{ steps.release_type.outputs.PRERELEASE == 'true' }}
